[package]
name = "local-app-builder-cli"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The `local-app-builder` command: checks this machine and installs the toolchain Local App builds run with."

# A leaf of the workspace: nothing depends on it (check_deps.py R7).
[lib]
name = "local_app_builder_cli"
path = "src/lib.rs"

[[bin]]
name = "local-app-builder"
path = "src/main.rs"

[dependencies]
local-app-builder-host = { path = "../local-app-builder-host" }
tokio.workspace = true

[dev-dependencies]
flate2 = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tempfile = "3.13"

[lints]
workspace = true
