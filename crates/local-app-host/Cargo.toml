[package]
name = "local-app-host"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "What a Mac provides the Local App service: the isolated command executor that builds an app without a guest."

# Sits above the service (it implements the service's `BuildExecutor`) and below the command line and any desktop
# shell that wants the same executor (check_deps.py R8).
[dependencies]
async-trait.workspace = true
local-app-contracts = { path = "../local-app-contracts" }
local-app-service = { path = "../local-app-service" }
tokio = { workspace = true, features = ["io-util", "process", "time"] }

[dev-dependencies]
tempfile = "3.13"

[lints]
workspace = true
