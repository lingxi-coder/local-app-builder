[package]
name = "local-app-cli"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The `local-app` command: runs the Local App service outside LingXi."

# A leaf of the workspace: nothing depends on it (check_deps.py R7). It sits above the service and may use any of it.
[lib]
name = "local_app_cli"
path = "src/lib.rs"

[[bin]]
name = "local-app"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
local-app-host = { path = "../local-app-host" }
local-app-service = { path = "../local-app-service" }
local-apps = { path = "../local-apps", default-features = false }
mcp-wire = { path = "../mcp-wire" }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util"] }

[dev-dependencies]
flate2 = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tempfile = "3.13"
tokio = { workspace = true, features = ["io-std", "io-util", "test-util"] }

[lints]
workspace = true
