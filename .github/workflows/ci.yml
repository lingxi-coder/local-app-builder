# Every step below was run locally (scripts/check-all.sh, node --test, and the five template installs and builds on
# macOS); the workflow wiring itself has not run on a GitHub runner yet.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: ./scripts/check-all.sh
      - run: node --test scripts/tests/test-local-app-r4-libs.mjs

  templates:
    strategy:
      matrix:
        template: [react-dom, canvas-2d, three-3d, phaser-2d, babylon-3d]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The same commands the create-local-app skill runs on the user's machine.
      - working-directory: plugins/local-app-builder/assets/templates/${{ matrix.template }}/r4
        run: |
          npm exec --yes --package=pnpm@12.5.1 -- pnpm install --frozen-lockfile
          npm exec --yes --package=pnpm@12.5.1 -- pnpm build
          # The whole app is this one file; LocalApp publishes nothing else.
          test -f dist/index.html
          test "$(find dist -type f | wc -l)" -eq 1
