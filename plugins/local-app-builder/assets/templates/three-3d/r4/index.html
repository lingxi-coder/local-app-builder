<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` is load-bearing, not cosmetic: under the default
         `viewport-fit=auto` every `env(safe-area-inset-*)` resolves to 0, so
         bottom navigation clips under the iPhone home indicator and
         `deviceContext.safeArea` is always {0,0,0,0}. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <title>LingXi Local App</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/main.jsx"></script>
  </body>
</html>
